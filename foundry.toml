[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fuzz = { runs = 512 }
invariant = { runs = 128, depth = 60, fail_on_revert = false }
# The deploy script writes deployments/<chainId>.json for the backend.
fs_permissions = [{ access = "read-write", path = "./deployments" }]
# ProtocolVault and Clearing sit near the 24 KB code limit: build them for size (optimizer runs = 1); runtime gas cost is small on Arbitrum.
additional_compiler_profiles = [{ name = "size", optimizer_runs = 1 }]
compilation_restrictions = [
  { paths = "src/core/ProtocolVault.sol", optimizer_runs = 1 },
  { paths = "src/core/Clearing.sol", optimizer_runs = 1 },
]

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "solady/=node_modules/solady/src/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

[lint]
# Expiry logic is defined in block time on purpose; sequencer drift is seconds, far below our windows.
exclude_lints = ["block-timestamp"]
ignore = ["test/**/*.sol"]
